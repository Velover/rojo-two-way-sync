[package]
name = "twoway"
description = "Two-way sync between Roblox Studio and disk, for the trees a twoway.json lists."
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[dependencies]
anyhow = "1"
blake3 = "1"
diffy = "0.4"
globset = "0.4"
notify = "8"
rbx_binary = "3.0.1"
rbx_dom_weak = "4.2.0"
rbx_reflection = "7.0.0"
rbx_reflection_database = "3.0.1"
rbx_types = { version = "3.1", features = ["serde"] }
rbx_xml = "3.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }

[dev-dependencies]
tempfile = "3"
